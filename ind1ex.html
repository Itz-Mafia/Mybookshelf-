<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mybookshelf — Academic Study Portal</title>
  <!-- Google Fonts: Merriweather for academic headings, Plus Jakarta Sans for clean UI -->
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Default: Warm Whitish Paper & Ink Study Theme */
      --bg-page: #f6f5f0;
      --bg-card: #ffffff;
      --bg-subtle: #eceae2;
      --text-primary: #1c1e21;
      --text-secondary: #5c6066;
      --accent-main: #1d4ed8;
      --accent-hover: #1e40af;
      --accent-secondary: #0f766e;
      --border-color: #dcd9ce;
      --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 6px 16px rgba(0, 0, 0, 0.07);
      --radius: 10px;
    }

    body.dark-mode {
      /* Optional Night Reading Theme */
      --bg-page: #121417;
      --bg-card: #1b1e23;
      --bg-subtle: #252930;
      --text-primary: #f1f3f5;
      --text-secondary: #9ba1a8;
      --accent-main: #3b82f6;
      --accent-hover: #2563eb;
      --accent-secondary: #14b8a6;
      --border-color: #2e333d;
      --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 6px 16px rgba(0, 0, 0, 0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Sticky Top Header */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 0.85rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-sm);
    }

    .logo {
      font-family: 'Merriweather', serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
      text-decoration: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-badge {
      background: var(--accent-main);
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.7rem;
      padding: 3px 7px;
      border-radius: 5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Buttons */
    .btn {
      background-color: var(--accent-main);
      color: #ffffff;
      border: 1px solid transparent;
      padding: 0.55rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.15s ease, transform 0.1s ease;
      min-height: 40px;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background-color: var(--bg-subtle);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background-color: var(--border-color);
    }

    .btn-teal {
      background-color: var(--accent-secondary);
      color: #ffffff;
    }

    .btn-back {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      margin-bottom: 1.25rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
    }

    /* Main Container */
    .container {
      max-width: 920px;
      margin: 0 auto;
      padding: 1.75rem 1rem 3rem;
      width: 100%;
      flex: 1;
    }

    .page-header {
      margin-bottom: 1.75rem;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 1rem;
    }

    .section-title {
      font-family: 'Merriweather', serif;
      font-size: clamp(1.5rem, 3.5vw, 2.1rem);
      color: var(--text-primary);
      margin-bottom: 0.35rem;
    }

    .section-subtitle {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    /* Quick Search Bar on Home/Lists */
    .search-wrapper {
      margin-bottom: 1.5rem;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 0.8rem 1rem;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      background-color: var(--bg-card);
      color: var(--text-primary);
      font-size: 0.95rem;
      box-shadow: var(--shadow-sm);
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent-main);
    }

    /* Grid & Study Cards */
    .choice-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
      width: 100%;
    }

    .study-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.35rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
      position: relative;
    }

    .study-card.clickable {
      cursor: pointer;
    }

    .study-card.clickable:hover {
      border-color: var(--accent-main);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .card-tag {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--accent-main);
      background-color: var(--bg-subtle);
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 0.65rem;
      width: fit-content;
    }

    .study-card h3 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.4rem;
      line-height: 1.35;
    }

    .study-card p {
      color: var(--text-secondary);
      font-size: 0.875rem;
      line-height: 1.45;
      margin-bottom: 1.1rem;
    }

    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: auto;
    }

    .bookmark-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      color: var(--text-secondary);
    }

    .bookmark-btn.active {
      color: #eab308;
      border-color: #eab308;
    }

    /* Slide-Out Menu Drawer */
    .drawer-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 2000;
    }

    .drawer {
      position: fixed;
      top: 0;
      right: -360px;
      width: 100%;
      max-width: 340px;
      height: 100%;
      background-color: var(--bg-card);
      border-left: 1px solid var(--border-color);
      z-index: 2001;
      display: flex;
      flex-direction: column;
      transition: right 0.25s ease;
      overflow-y: auto;
      padding: 1.25rem;
    }

    .drawer.open {
      right: 0;
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 1.25rem;
    }

    .drawer-section {
      margin-bottom: 1.5rem;
    }

    .drawer-section-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--text-secondary);
      margin-bottom: 0.65rem;
    }

    .drawer-nav-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .drawer-link {
      text-align: left;
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 0.6rem 0.85rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .drawer-link:hover {
      border-color: var(--accent-main);
    }

    .owner-box {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1rem;
    }

    .empty-note {
      font-size: 0.82rem;
      color: var(--text-secondary);
      font-style: italic;
    }
  </style>
</head>

        tb: [
          { title: '1. Science & Technology Part 1 & 2', desc: 'Official Balbharati Textbook Archive', url: 'https://books.ebalbharati.in/' },
          { title: '2. Mathematics (Algebra & Geometry)', desc: 'Official Balbharati Textbook Archive', url: 'https://books.ebalbharati.in/' }
        ],
        imp: [
          { title: '1. Science Part 1 — Chapter 1: Gravitation', desc: 'Direct Chapter Exercise Solutions', url: 'https://maharashtraboardsolutions.guru/maharashtra-board-class-10-science-solutions-part-1-chapter-1/' },
          { title: '2. Science Part 2 — Chapter 1: Heredity and Evolution', desc: 'Direct Chapter Exercise Solutions', url: 'https://maharashtraboardsolutions.guru/maharashtra-board-class-10-science-solutions-part-2-chapter-1/' },
          { title: '3. Maths Part 1 — Linear Equations in Two Variables', desc: 'Direct Practice Set 1.1 Solutions', url: 'https://maharashtraboardsolutions.guru/maharashtra-board-class-10-maths-solutions-chapter-1-practice-set-1-1-part-1/' }
        ]
      },
      '11': {
        name: 'Class 11th (FYJC)',
        subtitle: 'Core Science & Mathematics Foundation',
        tb: [
          { title: '1. Class 11 Physics Textbook', desc: 'Official Balbharati e-Library', url: 'https://books.ebalbharati.in/' },
          { title: '2. Class 11 Mathematics Part 1 & 2', desc: 'Official Balbharati e-Library', url: 'https://books.ebalbharati.in/' },
          { title: '3. Class 11 Biology Textbook', desc: 'Official Balbharati e-Library', url: 'https://books.ebalbharati.in/' }
        ],
        imp: [
          { title: '1. Physics — Chapter 1: Units and Measurements', desc: 'Direct Chapter 1 Solutions', url: 'https://maharashtraboardsolutions.guru/maharashtra-board-class-11-physics-solutions-chapter-1/' },
          { title: '2. Biology — Chapter 1: Living World', desc: 'Direct Chapter 1 Solutions', url: 'https://maharashtraboardsolutions.guru/maharashtra-board-class-11-biology-solutions-chapter-1/' },
          { title: '3. Chemistry — Chapter 1: Some Basic Concepts', desc: 'Direct Chapter 1 Solutions', url: 'https://maharashtraboardsolutions.guru/maharashtra-board-class-11-chemistry-solutions-chapter-1/' }
        ]
      },
      '12': {
        name: 'Class 12th (HSC)',
        subtitle: 'Maharashtra State Board — Chapter-Wise Direct Access',
        tb: [
          { title: '1. Physics Textbook (Direct PDF)', desc: 'Balbharati Official Class 12 Physics PDF', url: 'https://books.ebalbharati.in/pdfs/1203040026.pdf' },
          { title: '2. Mathematics & Statistics Textbook', desc: 'Balbharati Official e-Library Portal', url: 'https://books.ebalbharati.in/' },
          { title: '3. Biology Textbook', desc: 'Balbharati Official e-Library Portal', url: 'https://books.ebalbharati.in/' },
          { title: '4. Information Technology (I.T.) Textbook', desc: 'Balbharati Official e-Library Portal', url: 'https://books.ebalbharati.in/' }
        ],
        impSubjects: [
          { id: 'physics', title: '1. Physics', desc: 'All 16 HSC Chapters — Direct Exercise Solutions & Imp Questions', chapters: physicsChapters },
          { id: 'maths', title: '2. Mathematics & Statistics', desc: 'All 15 HSC Chapters (Part 1 & 2) — Direct Exercise & Misc Solutions', chapters: mathsChapters },
          { id: 'biology', title: '3. Biology', desc: 'All 15 HSC Chapters — Direct Exercise Solutions & Imp Questions', chapters: biologyChapters },
          { id: 'it', title: '4. Information Technology (I.T.)', desc: 'All 6 HSC Science IT Chapters — Direct Chapter Solutions', chapters: itChapters }
        ]
      }
    };

    const allSearchableChapters = [
      ...physicsChapters,
      ...mathsChapters,
      ...biologyChapters,
      ...itChapters
    ];

    const container = document.getElementById('appContainer');

    // ==========================================
    // LOCAL STORAGE: BOOKMARKS, HISTORY & THEME
    // ==========================================
    function getBookmarks() {
      return JSON.parse(localStorage.getItem('mbs_bookmarks') || '[]');
    }

    function toggleBookmark(chId) {
      let bms = getBookmarks();
      const exists = bms.find(b => b.id === chId);
      if (exists) {
        bms = bms.filter(b => b.id !== chId);
      } else {
        const chObj = allSearchableChapters.find(c => c.id === chId);
        if (chObj) bms.unshift({ id: chObj.id, title: chObj.title, subject: chObj.subject, url: chObj.solutionsUrl });
      }
      localStorage.setItem('mbs_bookmarks', JSON.stringify(bms));
      renderDrawerLists();
    }

    function recordHistory(title, url) {
      let hist = JSON.parse(localStorage.getItem('mbs_history') || '[]');
      hist = hist.filter(h => h.title !== title);
      hist.unshift({ title, url });
      if (hist.length > 4) hist.pop();
      localStorage.setItem('mbs_history', JSON.stringify(hist));
      renderDrawerLists();
    }

    function renderDrawerLists() {
      const bmContainer = document.getElementById('bookmarksList');
      const histContainer = document.getElementById('historyList');
      const bms = getBookmarks();
      const hist = JSON.parse(localStorage.getItem('mbs_history') || '[]');

      if (bms.length === 0) {
        bmContainer.innerHTML = `<div class="empty-note">Tap ★ on any chapter card to save it here for quick exam revision.</div>`;
      } else {
        bmContainer.innerHTML = bms.map(b => `
          <a href="${b.url}" target="_blank" class="drawer-link" onclick="recordHistory('${b.title.replace(/'/g, "\\'")}', '${b.url}')">
            <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">★ ${b.title}</span>
            <span>↗</span>
          </a>
        `).join('');
      }

      if (hist.length === 0) {
        histContainer.innerHTML = `<div class="empty-note">No chapters opened yet in this session.</div>`;
      } else {
        histContainer.innerHTML = hist.map(h => `
          <a href="${h.url}" target="_blank" class="drawer-link">
            <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${h.title}</span>
            <span>↗</span>
          </a>
        `).join('');
      }
    }

    // Theme Switcher
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    if (localStorage.getItem('mbs_theme') === 'dark') {
      document.body.classList.add('dark-mode');
      themeToggleBtn.innerText = '☀️ Day';
    }

    themeToggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      localStorage.setItem('mbs_theme', isDark ? 'dark' : 'light');
      themeToggleBtn.innerText = isDark ? '☀️ Day' : '🌙 Night';
    });

    // ==========================================
    // DRAWER NAVIGATION & SEARCH
    // ==========================================
    const menuDrawer = document.getElementById('menuDrawer');
    const drawerOverlay = document.getElementById('drawerOverlay');

    function openDrawer() {
      renderDrawerLists();
      drawerOverlay.style.display = 'block';
      setTimeout(() => menuDrawer.classList.add('open'), 10);
    }

    function closeDrawer() {
      menuDrawer.classList.remove('open');
      setTimeout(() => drawerOverlay.style.display = 'none', 250);
    }

    document.getElementById('menuBtn').addEventListener('click', openDrawer);
    document.getElementById('closeDrawerBtn').addEventListener('click', closeDrawer);
    drawerOverlay.addEventListener('click', closeDrawer);
    document.getElementById('logoHome').addEventListener('click', goHome);

    window.navigateFromDrawer = function(target) {
      closeDrawer();
      if (target === 'home') goHome();
      else openClassMenu(target);
    };

    document.getElementById('drawerSearchInput').addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (q.length > 1) {
        closeDrawer();
        renderSearchResults(q);
      }
    });

    document.getElementById('shareAppBtn').addEventListener('click', () => {
      const shareUrl = window.location.href;
      if (navigator.share) {
        navigator.share({ title: 'Mybookshelf Study Portal', url: shareUrl });
      } else {
        navigator.clipboard.writeText(shareUrl);
        alert('Website link copied to clipboard!');
      }
    });

    // ==========================================
    // VIEW RENDERERS
    // ==========================================

    // View 1: Clean 3-Option Academic Homepage + Search Bar
    function goHome() {
      container.innerHTML = `
        <div class="page-header">
          <h1 class="section-title">Select Your Academic Class</h1>
          <p class="section-subtitle">Direct access to Maharashtra State Board Textbooks, Exercise Solutions & Important Questions</p>
        </div>

        <div class="search-wrapper">
          <input type="text" id="homeSearchInput" class="search-input" placeholder="🔍 Quick search any Class 12 chapter (e.g., Rotational Dynamics, Matrices, SEO)...">
        </div>

        <div class="choice-grid">
          <div class="study-card clickable" onclick="openClassMenu('10')">
            <div>
              <span class="card-tag">SSC Board</span>
              <h3>Class 10th</h3>
              <p>Science & Technology (Part 1 & 2) and Mathematics textbooks & practice sets.</p>
            </div>
            <span class="btn btn-secondary" style="width:100%;">Open Class 10th →</span>
          </div>

          <div class="study-card clickable" onclick="openClassMenu('11')">
            <div>
              <span class="card-tag">FYJC Science</span>
              <h3>Class 11th</h3>
              <p>Core Physics, Chemistry, Biology, and Mathematics textbooks & chapter solutions.</p>
            </div>
            <span class="btn btn-secondary" style="width:100%;">Open Class 11th →</span>
          </div>

          <div class="study-card clickable" onclick="openClassMenu('12')">
            <div>
              <span class="card-tag">HSC Board</span>
              <h3>Class 12th</h3>
              <p>Complete chapter-wise direct solutions & important questions for Physics, Maths, Biology & I.T.</p>
            </div>
            <span class="btn" style="width:100%;">Open Class 12th →</span>
          </div>
        </div>
      `;

      document.getElementById('homeSearchInput').addEventListener('input', (e) => {
        const q = e.target.value.trim().toLowerCase();
        if (q.length > 1) renderSearchResults(q);
      });
    }

    // View 2: Class Category Menu (Textbooks vs Important Questions)
    window.openClassMenu = function(classKey) {
      const cls = db[classKey];
      container.innerHTML = `
        <button class="btn-back" onclick="goHome()">← Back to All Classes</button>
        <div class="page-header">
          <h1 class="section-title">${cls.name}</h1>
          <p class="section-subtitle">${cls.subtitle}</p>
        </div>

        <div class="choice-grid">
          <div class="study-card clickable" onclick="openResourceList('${classKey}', 'tb')">
            <div>
              <span class="card-tag">Official PDFs</span>
              <h3>1. Textbooks (T.B)</h3>
              <p>Download or read official Balbharati State Board syllabus textbooks.</p>
            </div>
            <span class="btn" style="width:100%;">Browse Textbooks →</span>
          </div>

          <div class="study-card clickable" onclick="openResourceList('${classKey}', 'imp')">
            <div>
              <span class="card-tag">Direct Solutions</span>
              <h3>2. Important Questions & Solutions</h3>
              <p>Chapter-by-chapter board exercise solutions and important exam questions.</p>
            </div>
            <span class="btn btn-teal" style="width:100%;">Browse Chapters →</span>
          </div>
        </div>
      `;
    };

    // View 3: Resource / Subject List
    window.openResourceList = function(classKey, type) {
      const cls = db[classKey];
      const typeTitle = type === 'tb' ? 'Textbooks (Balbharati)' : 'Important Questions & Chapter Solutions';

      if (classKey === '12' && type === 'imp') {
        let subjectsHTML = cls.impSubjects.map(subj => `
          <div class="study-card clickable" onclick="openChaptersList('${subj.id}')">
            <div>
              <span class="card-tag">${subj.chapters.length} Chapters</span>
              <h3>${subj.title}</h3>
              <p>${subj.desc}</p>
            </div>
            <span class="btn" style="width:100%;">Select Chapter →</span>
          </div>
        `).join('');

        container.innerHTML = `
          <button class="btn-back" onclick="openClassMenu('12')">← Back to ${cls.name}</button>
          <div class="page-header">
            <h1 class="section-title">${cls.name} — Select Subject</h1>
            <p class="section-subtitle">Choose a subject to view all HSC chapters with direct links</p>
          </div>
          <div class="choice-grid">${subjectsHTML}</div>
        `;
      } else {
        const items = cls[type];
        let itemsHTML = items.map(item => `
          <div class="study-card">
            <div>
              <span class="card-tag">${cls.name}</span>
              <h3>${item.title}</h3>
              <p>${item.desc}</p>
            </div>
            <div class="card-actions">
              <a href="${item.url}" target="_blank" class="btn" onclick="recordHistory('${item.title.replace(/'/g, "\\'")}', '${item.url}')">Open Direct Resource ↗</a>
            </div>
          </div>
        `).join('');

        container.innerHTML = `
          <button class="btn-back" onclick="openClassMenu('${classKey}')">← Back to ${cls.name}</button>
          <div class="page-header">
            <h1 class="section-title">${cls.name} — ${typeTitle}</h1>
            <p class="section-subtitle">Click any resource below to open it directly</p>
          </div>
          <div class="choice-grid">${itemsHTML}</div>
        `;
      }
    };

    // View 4: Direct Chapter List with Dual Action Buttons & Bookmark Star
    window.openChaptersList = function(subjId) {
      const subjObj = db['12'].impSubjects.find(s => s.id === subjId);
      const bookmarks = getBookmarks();

      let chaptersHTML = subjObj.chapters.map(ch => {
        const isBookmarked = bookmarks.some(b => b.id === ch.id);
        const btn1Label = ch.btn1Text || "📘 Exercise Solutions";
        const btn2Label = ch.btn2Text || "🎯 Important Questions";

        const secondButtonHTML = ch.impUrl ? `
          <a href="${ch.impUrl}" target="_blank" class="btn btn-teal" onclick="recordHistory('${ch.title.replace(/'/g, "\\'")} (Imp)', '${ch.impUrl}')">${btn2Label} ↗</a>
        ` : '';

        return `
          <div class="study-card">
            <button class="bookmark-btn ${isBookmarked ? 'active' : ''}" onclick="handleBookmarkClick('${ch.id}', '${subjId}')" title="Bookmark Chapter">★</button>
            <div>
              <span class="card-tag">${ch.subject}</span>
              <h3 style="padding-right: 2rem;">${ch.title}</h3>
              <p>Opens chapter questions & answers directly without extra menus.</p>
            </div>
            <div class="card-actions">
              <a href="${ch.solutionsUrl}" target="_blank" class="btn" onclick="recordHistory('${ch.title.replace(/'/g, "\\'")}', '${ch.solutionsUrl}')">${btn1Label} ↗</a>
              ${secondButtonHTML}
            </div>
          </div>
        `;
      }).join('');

      container.innerHTML = `
        <button class="btn-back" onclick="openResourceList('12', 'imp')">← Back to Class 12 Subjects</button>
        <div class="page-header">
          <h1 class="section-title">${subjObj.title} — All Chapters</h1>
          <p class="section-subtitle">Every button below opens that specific lesson's page directly</p>
        </div>
        <div class="choice-grid">${chaptersHTML}</div>
      `;
    };

    window.handleBookmarkClick = function(chId, subjId) {
      toggleBookmark(chId);
      openChaptersList(subjId);
    };

    // View 5: Live Search Results View
    function renderSearchResults(query) {
      const matches = allSearchableChapters.filter(ch =>
        ch.title.toLowerCase().includes(query) || ch.subject.toLowerCase().includes(query)
      );

      let resultsHTML = '';
      if (matches.length === 0) {
        resultsHTML = `<p class="empty-note">No chapters matched "${query}". Try searching words like "Wave", "Thermodynamics", "Logic", or "Biology".</p>`;
      } else {
        resultsHTML = matches.map(ch => `
          <div class="study-card">
            <div>
              <span class="card-tag">${ch.subject}</span>
              <h3>${ch.title}</h3>
              <p>Direct chapter link</p>
            </div>
            <div class="card-actions">
              <a href="${ch.solutionsUrl}" target="_blank" class="btn" onclick="recordHistory('${ch.title.replace(/'/g, "\\'")}', '${ch.solutionsUrl}')">📘 Exercise Solutions ↗</a>
              ${ch.impUrl ? `<a href="${ch.impUrl}" target="_blank" class="btn btn-teal" onclick="recordHistory('${ch.title.replace(/'/g, "\\'")} (Imp)', '${ch.impUrl}')">🎯 Important Questions ↗</a>` : ''}
            </div>
          </div>
        `).join('');
      }

      container.innerHTML = `
        <button class="btn-back" onclick="goHome()">← Clear Search & Back Home</button>
        <div class="page-header">
          <h1 class="section-title">Search Results for "${query}"</h1>
          <p class="section-subtitle">Found ${matches.length} matching chapter(s)</p>
        </div>
        <div class="choice-grid">${resultsHTML}</div>
      `;
    }

    // Initialize Home on Load
    window.onload = () => {
      goHome();
    }; 
</script>
</body>
</html>
