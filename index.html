      --bg-secondary: #f1f5f9;
      --bg-card: #ffffff;

      --text-secondary: #475569;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-soft: rgba(79, 70, 229, 0.08);
      --border: #e2e8f0;
      --success: #10b981;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --radius: 12px;
    }

    [data-theme="dark"] {
      --bg-primary: #090d16;
      --bg-secondary: #111827;
      --bg-card: #1f2937;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --accent-soft: rgba(99, 102, 241, 0.15);
      --border: #374151;
      --success: #34d399;
      --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      transition: background-color 0.2s ease, color 0.2s ease;
      padding-bottom: 4rem;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand h1 {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.025em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 0.85rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-primary);
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      color: #fff;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.25rem;
    }

    .dashboard-banner {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1.25rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
      align-items: center;
      box-shadow: var(--shadow);
    }

    .progress-box {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--success);
      width: 0%;
      transition: width 0.3s ease;
    }

    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1rem;
      align-items: center;
      justify-content: space-between;
    }

    .class-tabs {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .search-input {
      flex: 1;
      min-width: 220px;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 0.9rem;
    }

    .subject-bar {
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
    }

    .subject-pill {
      white-space: nowrap;
      padding: 0.4rem 0.85rem;
      border-radius: 6px;
      background: var(--bg-card);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .subject-pill.active {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    .textbook-callout {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 1.25rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      box-shadow: var(--shadow);
    }

    .chapter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
    }

    .chapter-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.8rem;
      box-shadow: var(--shadow);
      transition: transform 0.15s ease;
    }

    .chapter-card:hover {
      transform: translateY(-2px);
    }

    .chapter-card.completed {
      border-color: var(--success);
    }

    .chapter-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
    }

    .chapter-num {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
    }

    .chapter-title {
      font-size: 1rem;
      font-weight: 700;
      margin-top: 0.3rem;
      color: var(--text-primary);

    .chapter-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      color: var(--text-secondary);
      padding: 0.1rem;

      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);

  </style>
</head>

  <!-- Firebase Auth Module with Safe Popup Handling -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY", // Replace with your Firebase API key
      authDomain: "mybookshelf-7da85.firebaseapp.com",
      projectId: "mybookshelf-7da85",
      storageBucket: "mybookshelf-7da85.firebasestorage.app",
      messagingSenderId: "1009549531448",
      appId: "1:1009549531448:web:206c914a2e26c1962d49cd"
    };

    let auth = null;
    let currentUser = null;

    try {
      const app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      const provider = new GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });

      onAuthStateChanged(auth, (user) => {
        currentUser = user;
        const authBtn = document.getElementById("authBtn");
        const welcomeText = document.getElementById("welcomeText");
        if (user) {
          authBtn.textContent = "Sign Out";
          welcomeText.textContent = `Welcome, ${user.displayName ? user.displayName.split(' ')[0] : 'Scholar'}`;
        } else {
          authBtn.textContent = "Sign In";
          welcomeText.textContent = "Welcome, Scholar";
        }
      });

      window.handleAuthClick = async () => {
        if (!auth) {
          alert("Firebase authentication is initializing or missing API key.");
          return;
        }
        try {
          if (currentUser) {
            await signOut(auth);
          } else {
            await signInWithPopup(auth, provider);
          }
        } catch (err) {
          console.error("Auth error:", err);
          alert("Sign-in failed. Please ensure your Firebase authorized domains include localhost and GitHub Pages.");
        }
      };
    } catch (e) {
      console.warn("Firebase initialization notice:", e);
    }
  </script>

    let activeClass = localStorage.getItem("mbs_activeClass") || "12";
    let activeSubject = localStorage.getItem("mbs_activeSubject") || "Physics";
    let completedChapters = JSON.parse(localStorage.getItem("mbs_completed") || "{}");
    let bookmarkedChapters = JSON.parse(localStorage.getItem("mbs_bookmarks") || "{}");
    let showBookmarksOnly = false;

    function getChapterKey(cls, subj, index) {
      return `${cls}_${subj}_${index + 1}`;
    }

    function selectClass(cls) {
      activeClass = cls;
      localStorage.setItem("mbs_activeClass", cls);
      const subjects = Object.keys(CURRICULUM[cls].subjects);
      if (!subjects.includes(activeSubject)) {
        activeSubject = subjects[0];
        localStorage.setItem("mbs_activeSubject", activeSubject);
      }
      renderClassTabs();
      renderSubjectPills();
      renderChapters();
    }

    function selectSubject(subj) {
      activeSubject = subj;
      localStorage.setItem("mbs_activeSubject", subj);
      renderSubjectPills();
      renderChapters();
    }

    function renderClassTabs() {
      const buttons = document.querySelectorAll("#classTabs .tab-btn");
      const map = ["12", "11", "10"];
      buttons.forEach((btn, idx) => {
        btn.classList.toggle("active", map[idx] === activeClass);
      });
    }

    function renderSubjectPills() {
      const bar = document.getElementById("subjectBar");
      const subjects = Object.keys(CURRICULUM[activeClass].subjects);
      bar.innerHTML = subjects.map(subj => `
        <button class="subject-pill ${subj === activeSubject ? 'active' : ''}" onclick="selectSubject('${subj}')">
          ${subj}
        </button>
      `).join("");
    }

    function renderTextbookBanner() {
      const banner = document.getElementById("textbookBanner");
      const subjData = CURRICULUM[activeClass].subjects[activeSubject];
      banner.innerHTML = `
        <div>
          <span style="font-size:0.7rem; font-weight:700; text-transform:uppercase; color:var(--accent);">
            Official eBalbharati PDF
          </span>
          <h3 style="font-size: 1rem; font-weight: 700; margin-top:0.1rem;">
            Class ${activeClass} ${activeSubject} Full Textbook
          </h3>
        </div>
        <a href="${subjData.pdf}" target="_blank" rel="noopener noreferrer" class="btn btn-primary" onclick="logActivity('Opened Textbook: Class ${activeClass} ${activeSubject}')">
          📄 Download PDF
        </a>
      `;
    }

    function renderChapters() {
      renderTextbookBanner();
      const grid = document.getElementById("chapterGrid");
      const query = document.getElementById("searchInput").value.trim().toLowerCase();
      const subjData = CURRICULUM[activeClass].subjects[activeSubject];
      const baseDomain = "https://maharashtraboardsolutions.guru/";

      const totalCh = subjData.chapters.length;
      let doneCount = 0;
      subjData.chapters.forEach((_, idx) => {
        if (completedChapters[getChapterKey(activeClass, activeSubject, idx)]) doneCount++;
      });
      const pct = totalCh > 0 ? Math.round((doneCount / totalCh) * 100) : 0;
      document.getElementById("progressPercent").textContent = `${pct}% (${doneCount}/${totalCh})`;
      document.getElementById("progressBar").style.width = `${pct}%`;

      const cardsHtml = subjData.chapters.map((title, idx) => {
        const chNum = idx + 1;
        const key = getChapterKey(activeClass, activeSubject, idx);
        const isDone = !!completedChapters[key];
        const isBookmarked = !!bookmarkedChapters[key];

        if (query && !title.toLowerCase().includes(query) && !`chapter ${chNum}`.includes(query)) return "";
        if (showBookmarksOnly && !isBookmarked) return "";

        const solutionUrl = `${baseDomain}${subjData.solutionSlug}${chNum}/`;

        return `
          <article class="chapter-card ${isDone ? 'completed' : ''}">
            <div>
              <div class="chapter-header">
                <span class="chapter-num">Chapter ${chNum}</span>
                <div style="display:flex; gap:0.3rem; align-items:center;">
                  <button class="icon-btn ${isBookmarked ? 'bookmarked' : ''}" title="Bookmark" onclick="toggleBookmark('${key}')">
                    ${isBookmarked ? '★' : '☆'}
                  </button>
                  <label style="display:flex; align-items:center; gap:0.2rem; font-size:0.75rem; cursor:pointer;">
                    <input type="checkbox" ${isDone ? 'checked' : ''} onchange="toggleComplete('${key}', '${title.replace(/'/g, "\\'")}')" />
                    Done
                  </label>
                </div>
              </div>
              <h4 class="chapter-title">${title}</h4>
            </div>

            <div class="chapter-actions">
              <a href="${solutionUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-primary" onclick="logActivity('Studied Ch ${chNum}: ${title.replace(/'/g, "\\'")}')">
                📖 Solutions
              </a>
              <a href="${subjData.pdf}" target="_blank" rel="noopener noreferrer" class="btn">
                📥 PDF
              </a>
            </div>
          </article>
        `;
      }).join("");

      grid.innerHTML = cardsHtml || `<p style="color:var(--text-secondary); font-size: 0.9rem;">No matching chapters found.</p>`;
    }

    function toggleComplete(key, title) {
      completedChapters[key] = !completedChapters[key];
      localStorage.setItem("mbs_completed", JSON.stringify(completedChapters));
      if (completedChapters[key]) logActivity(`Completed: ${title}`);
      renderChapters();
    }

    function toggleBookmark(key) {
      bookmarkedChapters[key] = !bookmarkedChapters[key];
      localStorage.setItem("mbs_bookmarks", JSON.stringify(bookmarkedChapters));
      renderChapters();
    }

    function toggleBookmarkView() {
      showBookmarksOnly = !showBookmarksOnly;
      const btn = document.getElementById("bookmarkFilterBtn");
      btn.classList.toggle("btn-primary", showBookmarksOnly);
      renderChapters();
    }

    function logActivity(text) {
      const stamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const msg = `Last activity (${stamp}): ${text}`;
      localStorage.setItem("mbs_recent", msg);
      document.getElementById("recentActivityText").textContent = msg;
    }

    function exportProgress() {
      const payload = { exportedAt: new Date().toISOString(), completedChapters, bookmarkedChapters };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "mybookshelf-progress.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    function toggleTheme() {
      const html = document.documentElement;
      const next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
      html.setAttribute("data-theme", next);
      localStorage.setItem("mbs_theme", next);
      document.getElementById("themeToggleBtn").textContent = next === "dark" ? "☀️" : "🌙";
    }

    (function init() {
      const savedTheme = localStorage.getItem("mbs_theme") || "light";
      document.documentElement.setAttribute("data-theme", savedTheme);
      document.getElementById("themeToggleBtn").textContent = savedTheme === "dark" ? "☀️" : "🌙";

      const savedRecent = localStorage.getItem("mbs_recent");
      if (savedRecent) document.getElementById("recentActivityText").textContent = savedRecent;

      selectClass(activeClass);
    })();
  </script>
</body>
</html>
