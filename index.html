      --bg-secondary: #f1f5f9;
      --bg-card: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #475569;

      --border: #e2e8f0;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --radius: 12px;
    }

    [data-theme="dark"] {
      --bg-primary: #090d16;
      --bg-secondary: #111827;
      --bg-card: #1f2937;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --accent-soft: rgba(99, 102, 241, 0.15);
      --border: #374151;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);

      transition: background-color 0.25s ease, color 0.25s ease;
      padding-bottom: 5rem;
    }

    /* Sticky Header */

      top: 0;
      z-index: 1000;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      box-shadow: var(--shadow);

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand h1 {

      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.025em;

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-primary);
      text-decoration: none;
      transition: all 0.15s ease;

    .btn:hover {

      color: var(--accent);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      color: #fff;

      border-radius: var(--radius);

      margin-bottom: 1.5rem;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1.5rem;
      align-items: center;
      box-shadow: var(--shadow);
    }

    @media (max-width: 768px) {

        grid-template-columns: 1fr;
      }

    .progress-box {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      min-width: 240px;
    }

    .progress-track {
      width: 100%;
      height: 9px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--success);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Controls Bar */
    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      align-items: center;
      justify-content: space-between;

      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.15s;

    .tab-btn.active {

      color: #fff;
      border-color: var(--accent);
    }

      flex: 1;
      min-width: 260px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 0.65rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 0.95rem;
    }

    .subject-bar {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      margin-bottom: 1.25rem;
    }

      border-radius: 8px;
      background: var(--bg-card);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;

      margin-bottom: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      box-shadow: var(--shadow);
    }

    /* Chapters Grid */
    .chapter-grid {
      display: grid;

    .chapter-card {

      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1rem;

      align-items: flex-start;
      gap: 0.5rem;

      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: var(--shadow);

    }

      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }

  </style>
</head>

  <!-- Firebase Auth Module (Bulletproof Login Fix) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY", // Replace with your Firebase API key
      authDomain: "mybookshelf-7da85.firebaseapp.com",
      projectId: "mybookshelf-7da85",
      storageBucket: "mybookshelf-7da85.firebasestorage.app",
      messagingSenderId: "1009549531448",
      appId: "1:1009549531448:web:206c914a2e26c1962d49cd"
    };

    let auth = null;
    let currentUser = null;

    try {
      const app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      setPersistence(auth, browserLocalPersistence);
      const provider = new GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });

      onAuthStateChanged(auth, (user) => {
        currentUser = user;
        const authBtn = document.getElementById("authBtn");
        const welcomeText = document.getElementById("welcomeText");
        if (user) {
          authBtn.textContent = "Sign Out";
          welcomeText.textContent = `Welcome back, ${user.displayName ? user.displayName.split(' ')[0] : 'Scholar'}`;
          showToast(`Signed in as ${user.email}`);
        } else {
          authBtn.textContent = "Sign In with Google";
          welcomeText.textContent = "Welcome, Scholar";
        }
      });

      window.handleAuthClick = async () => {
        if (!auth) {
          showToast("Firebase Auth error: Check API configuration.");
          return;
        }
        try {
          if (currentUser) {
            await signOut(auth);
            showToast("Successfully signed out.");
          } else {
            await signInWithPopup(auth, provider);
          }
        } catch (err) {
          console.error("Auth popup error:", err);
          showToast("Sign-in popup blocked or domain not authorized in Firebase.");
        }
      };
    } catch (e) {
      console.warn("Firebase initialization skipped:", e);
    }
  </script>

    function getChapterKey(cls, subj, index) {
      return `${cls}_${subj}_${index + 1}`;
    }

    function showToast(message) {
      const container = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 200);
      }, 3000);
    }

    function selectClass(cls) {
      activeClass = cls;
      localStorage.setItem("mbs_activeClass", cls);
      const subjects = Object.keys(CURRICULUM[cls].subjects);
      if (!subjects.includes(activeSubject)) {
        activeSubject = subjects[0];
        localStorage.setItem("mbs_activeSubject", activeSubject);
      }
      renderClassTabs();
      renderSubjectPills();
      renderChapters();
    }

    function selectSubject(subj) {
      activeSubject = subj;
      localStorage.setItem("mbs_activeSubject", subj);
      renderSubjectPills();
      renderChapters();
    }

    function renderClassTabs() {
      const buttons = document.querySelectorAll("#classTabs .tab-btn");
      const map = ["12", "11", "10"];
      buttons.forEach((btn, idx) => {
        btn.classList.toggle("active", map[idx] === activeClass);
      });
    }

    function renderSubjectPills() {
      const bar = document.getElementById("subjectBar");
      const subjects = Object.keys(CURRICULUM[activeClass].subjects);
      bar.innerHTML = subjects.map(subj => `
        <button class="subject-pill ${subj === activeSubject ? 'active' : ''}" onclick="selectSubject('${subj}')">
          ${subj}
        </button>
      `).join("");
    }

    function renderTextbookBanner() {
      const banner = document.getElementById("textbookBanner");
      const subjData = CURRICULUM[activeClass].subjects[activeSubject];
      banner.innerHTML = `
        <div>
          <span style="font-size:0.75rem; font-weight:700; text-transform:uppercase; color:var(--accent);">
            Official eBalbharati PDF
          </span>
          <h3 style="font-size: 1.05rem; font-weight: 700; margin-top:0.2rem;">
            Class ${activeClass}th ${activeSubject} Full Textbook
          </h3>
        </div>
        <a href="${subjData.pdf}" target="_blank" rel="noopener noreferrer" class="btn btn-primary" onclick="logActivity('Opened Textbook: Class ${activeClass} ${activeSubject}')">
          📄 Download / Read Full PDF
        </a>
      `;
    }

    function renderChapters() {
      renderTextbookBanner();
      const grid = document.getElementById("chapterGrid");
      const query = document.getElementById("searchInput").value.trim().toLowerCase();
      const subjData = CURRICULUM[activeClass].subjects[activeSubject];
      const baseDomain = "https://maharashtraboardsolutions.guru/";

      const totalCh = subjData.chapters.length;
      let doneCount = 0;
      subjData.chapters.forEach((_, idx) => {
        if (completedChapters[getChapterKey(activeClass, activeSubject, idx)]) doneCount++;
      });
      const pct = totalCh > 0 ? Math.round((doneCount / totalCh) * 100) : 0;
      document.getElementById("progressPercent").textContent = `${pct}% (${doneCount}/${totalCh})`;
      document.getElementById("progressBar").style.width = `${pct}%`;

      const cardsHtml = subjData.chapters.map((title, idx) => {
        const chNum = idx + 1;
        const key = getChapterKey(activeClass, activeSubject, idx);
        const isDone = !!completedChapters[key];
        const isBookmarked = !!bookmarkedChapters[key];
        const currentNote = chapterNotes[key] || "";

        if (query && !title.toLowerCase().includes(query) && !`chapter ${chNum}`.includes(query)) return "";
        if (showBookmarksOnly && !isBookmarked) return "";

        const solutionUrl = `${baseDomain}${subjData.solutionSlug}${chNum}/`;
        const impUrl = subjData.impSlug ? `${baseDomain}${subjData.impSlug}${chNum}/` : null;

        return `
          <article class="chapter-card ${isDone ? 'completed' : ''}">
            <div>
              <div class="chapter-header">
                <span class="chapter-num">Chapter ${chNum}</span>
                <div style="display:flex; gap:0.4rem; align-items:center;">
                  <button class="icon-btn ${isBookmarked ? 'bookmarked' : ''}" title="Bookmark" onclick="toggleBookmark('${key}')">
                    ${isBookmarked ? '★' : '☆'}
                  </button>
                  <label style="display:flex; align-items:center; gap:0.25rem; font-size:0.8rem; cursor:pointer; font-weight:600;">
                    <input type="checkbox" ${isDone ? 'checked' : ''} onchange="toggleComplete('${key}', '${title.replace(/'/g, "\\'")}')" />
                    Done
                  </label>
                </div>
              </div>
              <h4 class="chapter-title">${title}</h4>
              <div class="notes-box">
                <input type="text" class="notes-input" placeholder="Add quick study note..." value="${currentNote.replace(/"/g, '&quot;')}" oninput="saveNote('${key}', this.value)" />
              </div>
            </div>

            <div class="chapter-actions">
              <a href="${solutionUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-primary" onclick="logActivity('Studied Ch ${chNum}: ${title.replace(/'/g, "\\'")}')">
                📖 Solutions
              </a>
              ${impUrl ? `
                <a href="${impUrl}" target="_blank" rel="noopener noreferrer" class="btn" onclick="logActivity('Imp Qs Ch ${chNum}: ${title.replace(/'/g, "\\'")}')">
                  ⚡ Imp Questions
                </a>
              ` : ''}
              <a href="${subjData.pdf}" target="_blank" rel="noopener noreferrer" class="btn">
                📄 PDF
              </a>
            </div>
          </article>
        `;
      }).join("");

      grid.innerHTML = cardsHtml || `<p style="color:var(--text-secondary); font-size: 0.95rem;">No matching chapters found.</p>`;
    }

    function toggleComplete(key, title) {
      completedChapters[key] = !completedChapters[key];
      localStorage.setItem("mbs_completed", JSON.stringify(completedChapters));
      if (completedChapters[key]) {
        logActivity(`Completed: ${title}`);
        showToast(`Marked completed: ${title}`);
      }
      renderChapters();
    }

    function toggleBookmark(key) {
      bookmarkedChapters[key] = !bookmarkedChapters[key];
      localStorage.setItem("mbs_bookmarks", JSON.stringify(bookmarkedChapters));
      renderChapters();
      showToast(bookmarkedChapters[key] ? "Bookmark added" : "Bookmark removed");
    }

    function saveNote(key, val) {
      chapterNotes[key] = val;
      localStorage.setItem("mbs_notes", JSON.stringify(chapterNotes));
    }

    function toggleBookmarkView() {
      showBookmarksOnly = !showBookmarksOnly;
      const btn = document.getElementById("bookmarkFilterBtn");
      btn.classList.toggle("btn-primary", showBookmarksOnly);
      renderChapters();
    }

    function logActivity(text) {
      const stamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const msg = `Last activity (${stamp}): ${text}`;
      localStorage.setItem("mbs_recent", msg);
      document.getElementById("recentActivityText").textContent = msg;
    }

    function toggleTheme() {
      const html = document.documentElement;
      const next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
      html.setAttribute("data-theme", next);
      localStorage.setItem("mbs_theme", next);
      document.getElementById("themeToggleBtn").textContent = next === "dark" ? "☀️" : "🌙";
    }

    // Global Keyboard Shortcut Ctrl+K for Search
    window.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        document.getElementById("searchInput").focus();
      }
    });

    (function init() {
      const savedTheme = localStorage.getItem("mbs_theme") || "light";
      document.documentElement.setAttribute("data-theme", savedTheme);
      document.getElementById("themeToggleBtn").textContent = savedTheme === "dark" ? "☀️" : "🌙";

      const savedRecent = localStorage.getItem("mbs_recent");
      if (savedRecent) document.getElementById("recentActivityText").textContent = savedRecent;

      selectClass(activeClass);
    })();
  </script>
</body>
</html>
