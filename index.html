<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mybookshelf | Educational Platform</title>
    <!-- PDF.js for Document Viewing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0b0f19;
            --surface-card: #151c2e;
            --surface-hover: #1e293b;
            --accent-blue: #38bdf8;
            --accent-indigo: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-line: #334155;
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(11, 15, 25, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-line);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Syncopate', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logo span { color: var(--accent-blue); }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-indigo));
            color: #fff;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            min-height: 44px;
            transition: transform 0.1s ease;
        }

        .btn-primary:active { transform: scale(0.97); }

        .btn-back {
            background: var(--surface-card);
            border: 1px solid var(--border-line);
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 1.5rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .section-title {
            text-align: center;
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #fff, var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 2.5rem;
        }

        /* Grid Layouts */
        .choice-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.25rem;
            width: 100%;
        }

        .choice-card {
            background: var(--surface-card);
            border: 1px solid var(--border-line);
            border-radius: var(--radius);
            padding: 2rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 150px;
        }

        .choice-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-blue);
        }

        .choice-card h3 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .choice-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* PDF Viewer Modal */
        .viewer-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.95);
            z-index: 2000;
            flex-direction: column;
        }

        .viewer-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-line);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .viewer-body {
            flex: 1;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 1.5rem;
        }

        canvas#pdf-render-canvas {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo" onclick="goHome()">MY<span>BOOKSHELF</span></a>
        <button class="btn-primary" id="authBtn">Menu</button>
    </header>

    <main class="container" id="appContainer">
        <!-- Dynamically rendered views load here -->
    </main>

    <!-- PDF Reader Modal -->
    <div class="viewer-modal" id="viewerModal">
        <div class="viewer-header">
            <h3 id="viewerTitle" style="font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 70%;">Document Reader</h3>
            <button class="btn-primary" style="padding: 0.4rem 1rem; font-size: 0.85rem;" onclick="closeViewer()">Close</button>
        </div>
        <div class="viewer-body">
            <canvas id="pdf-render-canvas"></canvas>
        </div>
    </div>

    <script>
        // Configured Database with exact user links
        const db = {
            '10': {
                name: 'Class 10th',
                tb: [
                    { title: 'Class 10 Science Textbook', desc: 'NCERT Curriculum', pdf: 'https://raw.githubusercontent.com/mozilla/pdf.js/ba2edeae/web/compressed.tracemonkey-pldi-09.pdf' },
                    { title: 'Class 10 Mathematics Textbook', desc: 'NCERT Standard Math', pdf: 'https://raw.githubusercontent.com/mozilla/pdf.js/ba2edeae/web/compressed.tracemonkey-pldi-09.pdf' }
                ],
                imp: [
                    { title: 'Class 10 Science Important Questions', desc: 'Practice Question Bank', pdf: 'https://raw.githubusercontent.com/mozilla/pdf.js/ba2edeae/web/compressed.tracemonkey-pldi-09.pdf' }
                ]
            },
            '11': {
                name: 'Class 11th',
                tb: [
                    { title: 'Class 11 Physics Textbook', desc: 'State Board Curriculum', pdf: 'https://raw.githubusercontent.com/mozilla/pdf.js/ba2edeae/web/compressed.tracemonkey-pldi-09.pdf' }
                ],
                imp: [
                    { title: 'Class 11 Physics Important Questions', desc: 'Question Bank & Solutions', pdf: 'https://raw.githubusercontent.com/mozilla/pdf.js/ba2edeae/web/compressed.tracemonkey-pldi-09.pdf' }
                ]
            },
            '12': {
                name: 'Class 12th',
                tb: [
                    { title: '1. Physics Textbook', desc: 'Balbharati e-Library', url: 'https://books.ebalbharati.in', isExternal: true },
                    { title: '2. Maths Textbook', desc: 'Balbharati e-Library', url: 'https://books.ebalbharati.in', isExternal: true },
                    { title: '3. Biology Textbook', desc: 'Balbharati e-Library', url: 'https://books.ebalbharati.in', isExternal: true },
                    { title: '4. I.T. Textbook', desc: 'Balbharati e-Library', url: 'https://books.ebalbharati.in', isExternal: true }
                ],
                imp: [
                    { title: '1. Physics Important Questions', desc: 'Maharashtra Board Solutions', url: 'https://maharashtraboardsolutions.guru/maharashtra-state-board-class-12-physics-solutions/', isExternal: true },
                    { title: '2. Maths Important Questions', desc: 'Maharashtra Board Solutions', url: 'https://maharashtraboardsolutions.guru/', isExternal: true },
                    { title: '3. Biology Important Questions', desc: 'Maharashtra Board Solutions', url: 'https://maharashtraboardsolutions.guru/', isExternal: true },
                    { title: '4. I.T. Important Questions', desc: 'Maharashtra Board Solutions', url: 'https://maharashtraboardsolutions.guru/', isExternal: true }
                ]
            }
        };

        const container = document.getElementById('appContainer');

        // View 1: Homepage (Only 3 Options: 10, 11, 12th)
        function goHome() {
            container.innerHTML = `
                <h1 class="section-title">Mybookshelf</h1>
                <p class="section-subtitle">Select your academic class to get started</p>
                <div class="choice-grid">
                    <div class="choice-card" onclick="openClassMenu('10')">
                        <h3>Class 10th</h3>
                        <p>Science & Mathematics</p>
                    </div>
                    <div class="choice-card" onclick="openClassMenu('11')">
                        <h3>Class 11th</h3>
                        <p>Science & Core Math</p>
                    </div>
                    <div class="choice-card" onclick="openClassMenu('12')">
                        <h3>Class 12th</h3>
                        <p>Advanced Board Curriculum</p>
                    </div>
                </div>
            `;
        }

        // View 2: Class Menu (Leads to Textbooks & Important Questions)
        function openClassMenu(classKey) {
            const cls = db[classKey];
            container.innerHTML = `
                <button class="btn-back" onclick="goHome()">← Back to Classes</button>
                <h1 class="section-title">${cls.name}</h1>
                <p class="section-subtitle">Choose your preferred resource category</p>
                <div class="choice-grid">
                    <div class="choice-card" onclick="openResourceList('${classKey}', 'tb')">
                        <h3>📚 Textbooks (T.B)</h3>
                        <p>Balbharati & Reference Books</p>
                    </div>
                    <div class="choice-card" onclick="openResourceList('${classKey}', 'imp')">
                        <h3>📝 Important Questions</h3>
                        <p>Board Solutions & Practice</p>
                    </div>
                </div>
            `;
        }

        // View 3: Resource List
        function openResourceList(classKey, type) {
            const cls = db[classKey];
            const items = cls[type];
            const typeTitle = type === 'tb' ? 'Textbooks' : 'Important Questions';

            let itemsHTML = '';
            items.forEach(item => {
                let actionBtn = '';
                if (item.isExternal) {
                    actionBtn = `<a href="${item.url}" target="_blank" class="btn-primary" style="padding: 0.4rem 1rem; font-size: 0.85rem; width: 100%; text-align: center; text-decoration: none; display: inline-block;">Open Link ↗</a>`;
                } else {
                    actionBtn = `<button class="btn-primary" style="padding: 0.4rem 1rem; font-size: 0.85rem; width: 100%;" onclick="openBook('${item.title}', '${item.pdf}')">Read PDF</button>`;
                }

                itemsHTML += `
                    <div class="choice-card" style="align-items: flex-start; text-align: left;">
                        <span style="font-size: 0.75rem; text-transform: uppercase; color: var(--accent-blue); font-weight: 700; margin-bottom: 0.3rem;">${type === 'tb' ? 'Textbook' : 'Important Qs'}</span>
                        <h3 style="font-size: 1.1rem; margin-bottom: 0.3rem;">${item.title}</h3>
                        <p style="margin-bottom: 1rem; font-size: 0.85rem;">${item.desc}</p>
                        ${actionBtn}
                    </div>
                `;
            });

            container.innerHTML = `
                <button class="btn-back" onclick="openClassMenu('${classKey}')">← Back to ${cls.name}</button>
                <h1 class="section-title" style="font-size: 1.8rem; text-align: left;">${cls.name} - ${typeTitle}</h1>
                <p class="section-subtitle" style="text-align: left; margin-bottom: 1.5rem;">Select an option below</p>
                <div class="choice-grid">
                    ${itemsHTML}
                </div>
            `;
        }

        // PDF.js Reader Launcher
        async function openBook(title, pdfUrl) {
            document.getElementById('viewerTitle').innerText = title;
            document.getElementById('viewerModal').style.display = 'flex';

            const loadingTask = pdfjsLib.getDocument(pdfUrl);
            const pdf = await loadingTask.promise;
            const page = await pdf.getPage(1);
            
            const viewport = page.getViewport({ scale: 1.2 });
            const canvas = document.getElementById('pdf-render-canvas');
            const context = canvas.getContext('2d');
            
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            await page.render({ canvasContext: context, viewport: viewport }).promise;
        }

        function closeViewer() {
            document.getElementById('viewerModal').style.display = 'none';
        }

        // Initialize Home on Load
        window.onload = () => {
            goHome();
        };
    </script>
</body>
</html>
