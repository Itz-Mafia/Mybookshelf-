    }

    .btn-primary {

      color: #fff;

      align-items: center;

      flex-direction: column;
      gap: 0.4rem;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--success);
      width: 0%;
      transition: width 0.3s ease;
    }

      gap: 0.75rem;
      margin-bottom: 1.25rem;
      align-items: center;
      justify-content: space-between;

      gap: 0.5rem;
      flex-wrap: wrap;

      border-radius: 999px;

      background: var(--bg-card);
      color: var(--text-secondary);

      cursor: pointer;

      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 0.95rem;

      padding-bottom: 0.5rem;
      margin-bottom: 1.25rem;

      color: var(--text-secondary);

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    // Firebase Configuration (mybookshelf-7da85)
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY", // Replace with your mybookshelf-7da85 apiKey
      authDomain: "mybookshelf-7da85.firebaseapp.com",
      projectId: "mybookshelf-7da85",
      storageBucket: "mybookshelf-7da85.firebasestorage.app",
      messagingSenderId: "1009549531448",
      appId: "1:1009549531448:web:206c914a2e26c1962d49cd"
    };

    let auth = null;
    let currentUser = null;

    try {
      const app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      const provider = new GoogleAuthProvider();

      onAuthStateChanged(auth, (user) => {
        currentUser = user;
        const authBtn = document.getElementById("authBtn");
        const welcomeText = document.getElementById("welcomeText");
        if (user) {
          authBtn.textContent = "Sign Out";
          welcomeText.textContent = `Welcome back, ${user.displayName || "Scholar"}`;
        } else {
          authBtn.textContent = "Sign in with Google";
          welcomeText.textContent = "Welcome, Scholar";
        }
      });

      window.handleAuthClick = async () => {
        if (!auth) return;
        try {
          if (currentUser) {
            await signOut(auth);
          } else {
            await signInWithPopup(auth, provider);
          }
        } catch (err) {
          alert("Firebase Auth Notice: Make sure your domain is authorized in Firebase Console and your apiKey is set.");
        }
      };
    } catch (e) {
      console.warn("Firebase initialization skipped:", e);
    }
  </script>

    }

    function selectSubject(subj) {
      activeSubject = subj;
      localStorage.setItem("mbs_activeSubject", subj);
      renderSubjectPills();
      renderChapters();
    }

    function renderClassTabs() {
      const buttons = document.querySelectorAll("#classTabs .tab-btn");
      const map = ["12", "11", "10"];
      buttons.forEach((btn, idx) => {
        btn.classList.toggle("active", map[idx] === activeClass);
      });
    }

    function renderSubjectPills() {
      const bar = document.getElementById("subjectBar");
      const subjects = Object.keys(CURRICULUM[activeClass].subjects);
      bar.innerHTML = subjects.map(subj => `
        <button class="subject-pill ${subj === activeSubject ? 'active' : ''}" onclick="selectSubject('${subj}')">
          ${subj}
        </button>
      `).join("");
    }

    function renderTextbookBanner() {
      const banner = document.getElementById("textbookBanner");
      const subjData = CURRICULUM[activeClass].subjects[activeSubject];
      banner.innerHTML = `
        <div>
          <span style="font-size:0.75rem; font-weight:700; text-transform:uppercase; color:var(--accent);">
            Official eBalbharati Direct PDF
          </span>
          <h3 class="serif-title" style="margin-top:0.2rem;">
            Class ${activeClass}th ${activeSubject} Full Textbook
          </h3>
        </div>
        <a href="${subjData.pdf}" target="_blank" rel="noopener noreferrer" class="btn btn-primary" onclick="logActivity('Opened Class ${activeClass} ${activeSubject} Textbook PDF')">
          📥 Download / Read Full Textbook PDF
        </a>
      `;
    }

    function renderChapters() {
      renderTextbookBanner();
      const grid = document.getElementById("chapterGrid");
      const query = document.getElementById("searchInput").value.trim().toLowerCase();
      const subjData = CURRICULUM[activeClass].subjects[activeSubject];
      const baseDomain = "https://maharashtraboardsolutions.guru/";

      // Calculate subject progress
      const totalCh = subjData.chapters.length;
      let doneCount = 0;
      subjData.chapters.forEach((_, idx) => {
        if (completedChapters[getChapterKey(activeClass, activeSubject, idx)]) doneCount++;
      });
      const pct = totalCh > 0 ? Math.round((doneCount / totalCh) * 100) : 0;
      document.getElementById("progressPercent").textContent = `${pct}% (${doneCount}/${totalCh})`;
      document.getElementById("progressBar").style.width = `${pct}%`;

      const cardsHtml = subjData.chapters.map((title, idx) => {
        const chNum = idx + 1;
        const key = getChapterKey(activeClass, activeSubject, idx);
        const isDone = !!completedChapters[key];
        const isBookmarked = !!bookmarkedChapters[key];

        if (query && !title.toLowerCase().includes(query) && !`chapter ${chNum}`.includes(query)) {
          return "";
        }
        if (showBookmarksOnly && !isBookmarked) {
          return "";
        }

        const solutionUrl = `${baseDomain}${subjData.solutionSlug}${chNum}/`;
        const impUrl = subjData.impSlug ? `${baseDomain}${subjData.impSlug}${chNum}/` : null;

        return `
          <article class="chapter-card ${isDone ? 'completed' : ''}">
            <div>
              <div class="chapter-header">
                <span class="chapter-num">Chapter ${chNum}</span>
                <div style="display:flex; gap:0.35rem; align-items:center;">
                  <button class="icon-btn ${isBookmarked ? 'bookmarked' : ''}" title="Bookmark Chapter" onclick="toggleBookmark('${key}')">
                    ${isBookmarked ? '★' : '☆'}
                  </button>
                  <label style="display:flex; align-items:center; gap:0.25rem; font-size:0.8rem; cursor:pointer;">
                    <input type="checkbox" ${isDone ? 'checked' : ''} onchange="toggleComplete('${key}', '${title.replace(/'/g, "\\'")}')" />
                    Done
                  </label>
                </div>
              </div>
              <h4 class="chapter-title serif-title">${title}</h4>
            </div>

            <div class="chapter-actions">
              <a href="${solutionUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-primary" onclick="logActivity('Studied Ch ${chNum}: ${title.replace(/'/g, "\\'")}')">
                📖 Solutions
              </a>
              ${impUrl ? `
                <a href="${impUrl}" target="_blank" rel="noopener noreferrer" class="btn" onclick="logActivity('Practiced Imp Qs: ${title.replace(/'/g, "\\'")}')">
                  ⚡ Imp Questions
                </a>
              ` : ''}
              <a href="${subjData.pdf}" target="_blank" rel="noopener noreferrer" class="btn">
                📄 Textbook PDF
              </a>
            </div>
          </article>
        `;
      }).join("");

      grid.innerHTML = cardsHtml || `<p style="color:var(--text-secondary);">No matching chapters found.</p>`;
    }

    function toggleComplete(key, title) {
      completedChapters[key] = !completedChapters[key];
      localStorage.setItem("mbs_completed", JSON.stringify(completedChapters));
      if (completedChapters[key]) {
        logActivity(`Completed: ${title}`);
      }
      renderChapters();
    }

    function toggleBookmark(key) {
      bookmarkedChapters[key] = !bookmarkedChapters[key];
      localStorage.setItem("mbs_bookmarks", JSON.stringify(bookmarkedChapters));
      renderChapters();
    }

    function toggleBookmarkView() {
      showBookmarksOnly = !showBookmarksOnly;
      const btn = document.getElementById("bookmarkFilterBtn");
      btn.classList.toggle("btn-primary", showBookmarksOnly);
      renderChapters();
    }

    function logActivity(text) {
      const stamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const msg = `Last activity (${stamp}): ${text}`;
      localStorage.setItem("mbs_recent", msg);
      document.getElementById("recentActivityText").textContent = msg;
    }

    function exportProgress() {
      const payload = {
        exportedAt: new Date().toISOString(),
        completedChapters,
        bookmarkedChapters
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "mybookshelf-progress-backup.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    function toggleTheme() {
      const html = document.documentElement;
      const next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
      html.setAttribute("data-theme", next);
      localStorage.setItem("mbs_theme", next);
      document.getElementById("themeToggleBtn").textContent = next === "dark" ? "☀️ Light" : "🌙 Dark";
    }

    // Initialize Portal on Load
    (function init() {
      const savedTheme = localStorage.getItem("mbs_theme") || "light";
      document.documentElement.setAttribute("data-theme", savedTheme);
      document.getElementById("themeToggleBtn").textContent = savedTheme === "dark" ? "☀️ Light" : "🌙 Dark";

      const savedRecent = localStorage.getItem("mbs_recent");
      if (savedRecent) {
        document.getElementById("recentActivityText").textContent = savedRecent;
      }

      selectClass(activeClass);
    })();
  </script>
</body>
</html>
